name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean hidden characters and setup dummy google-services
        run: |
          python3 -c '
          import os, json
          for root, dirs, files in os.walk(".", topdown=False):
              for name in files + dirs:
                  clean = name.replace("\u200b", "").replace("\u200c", "").replace("\u200d", "").replace("\ufeff", "").strip()
                  if clean != name and clean:
                      os.rename(os.path.join(root, name), os.path.join(root, clean))
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".kts", ".gradle", ".toml")):
                      p = os.path.join(root, f)
                      try:
                          txt = open(p, "r", encoding="utf-8").read()
                          ntxt = txt.replace("\u200b", "").replace("\u200c", "").replace("\u200d", "").replace("\ufeff", "")
                          if ntxt != txt:
                              open(p, "w", encoding="utf-8").write(ntxt)
                      except Exception:
                          pass
          gs = {"project_info":{"project_number":"123456789","project_id":"demo-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456","android_client_info":{"package_name":"com.aistudio.cartoonstudio.bngkrx"}},"api_key":[{"current_key":"AIzaSyDummyKeyForBuild12345"}]}]}
          if os.path.exists("app"):
              json.dump(gs, open("app/google-services.json", "w"))
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (if present)
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
